<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A0A0A">
<title>FD13 Apparatus Check</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --accent:#7A0A0A; --accent-2:#5C0707; --accent-soft:#F7ECEC;
  --ground:#F5F3F2; --surface:#ffffff; --raised:#EEEAEA; --border:#E2D9D9; --rule:#F0EBEB; --control:#CFC5C5;
  --text:#1B1616; --muted:#6E6464; --ink-2:#3D3535;
  --ok:#2E6B2E; --ok-bg:#E8F3E8; --bad:#B3261E; --bad-bg:#FBEAE8; --bad-line:#EDC3BF;
  --info:#1F5C8B; --info-bg:#E8F1F8; --info-line:#B9D3E8; --warn:#8A5A00; --warn-bg:#FFF4E0;
  --radius:14px; --radius-s:10px;
  --font:"Geist", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--ground);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.6}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #E9B8B8;outline-offset:2px}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--control);border-radius:var(--radius-s);background:#fff;color:var(--text);min-height:46px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
h1{font-size:24px;font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:0}
h3{font-size:17px;font-weight:600;margin:0 0 8px}

/* Shared buttons */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:var(--radius-s);background:var(--accent);color:#fff;font-weight:600;font-size:16px;width:auto}
.btn-primary:hover{background:var(--accent-2)}
.btn-primary:disabled{background:var(--control);color:#4d4d4d}
.btn-primary.block{display:flex;width:100%}
.btn-second{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:var(--radius-s);border:1.5px solid var(--control);background:#fff;color:var(--text);font-weight:600}
.btn-second:hover{border-color:var(--text)}
.btn-second.block{display:flex;width:100%}
.btn-danger{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:var(--radius-s);background:var(--bad);color:#fff;font-weight:600}
.link-btn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px 0;text-align:left}
.link-btn:hover{color:var(--text)}
.err-text{color:var(--bad);font-size:14px;margin:10px 0 0;min-height:1em}
.note-hint{color:var(--bad);font-size:13px;margin:8px 0 0}

/* Sign in */
.signin{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 18px 80px}
.signin-col{width:100%;max-width:440px}
.brand-lg{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand-lg img{width:64px;height:64px;flex:none;object-fit:contain}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.divider{height:14px}
.stack{display:grid;gap:8px;margin-top:14px}
.stack label{font-size:14px;font-weight:600;color:var(--ink-2)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Top bar and tabs */
.head{position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--border)}
.topbar{background:var(--accent);color:#fff;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.brand img{width:44px;height:44px;flex:none;object-fit:contain}
.brand b{display:block;font-size:17px;font-weight:600;line-height:1.15}
.brand small{display:block;font-size:12.5px;opacity:.85}
.tabs{background:#fff}
.tabs-in{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:0 10px;align-items:center;overflow-x:auto}
.tabs button{min-height:52px;padding:0 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .spacer{flex:1}
.count{display:inline-block;min-width:22px;text-align:center;font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;font-weight:600}
.tabs button.edit-switch{min-height:38px;margin:7px 0 7px auto;padding:0 12px;border-radius:999px;border:1.5px solid var(--control);border-bottom-width:1.5px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button.edit-switch.on{background:var(--warn-bg);border-color:#D9B66A;color:#6B4700}

.page{max-width:760px;margin:0 auto;padding:18px 16px 170px}
.pagehead{margin:4px 0 14px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.pagehead .sub{margin:6px 0 0;color:var(--muted)}
.finding{margin:0 0 16px;font-size:15px;color:var(--ink-2)}
.finding b{color:var(--accent);font-weight:600}
.notice{font-size:14px;padding:12px 14px;border-radius:var(--radius-s);background:var(--info-bg);border:1px solid var(--info-line);color:#17466B;margin:0 0 14px}
.notice.warn{background:var(--warn-bg);border-color:#E9CF94;color:#6B4700}
.notice.bad{background:var(--bad-bg);border-color:var(--bad-line);color:#7A1A14}
.notice b{font-weight:600}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
.section-title:first-child{margin-top:0}
.station-addr{font-size:13px;color:var(--muted);margin:-4px 0 10px}

/* Filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.chip-btn{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--control);background:#fff;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink-2)}
.chip-btn.on{background:var(--text);border-color:var(--text);color:#fff}
.chip-btn.fail{color:var(--accent)}
.chip-btn.fail.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Unit and checklist cards */
.card-list{display:grid;gap:10px}
.unit{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.unit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 0 0 0}
.unit-main{text-align:left;padding:16px 16px;min-width:0;display:block;min-height:76px;width:100%}
.unit-name{display:block;font-size:18px;font-weight:600;line-height:1.2}
.unit-info{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-who{display:block;font-size:13px;color:var(--info);font-weight:600;margin-top:6px}
.unit-side{padding:0 14px 0 0;display:flex;align-items:center;gap:8px;justify-self:end}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--raised);color:var(--ink-2);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--control)}
.status.prog{background:var(--info-bg);color:var(--info)} .status.prog::before{background:var(--info)}
.status.done{background:var(--ok-bg);color:var(--ok)} .status.done::before{background:var(--ok)}
.status.fail{background:var(--bad-bg);color:var(--bad)} .status.fail::before{background:var(--bad)}
.unit-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--rule);padding:8px 12px;background:#FCFBFB;flex-wrap:wrap}
.report-link{min-height:36px;font-size:14px;font-weight:600;color:var(--accent);padding:0 4px}
.chev{font-size:22px;color:var(--muted);padding-right:2px}

/* Layout editing (admin) */
.edit-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.edit-row button{min-height:36px;padding:0 10px;border-radius:8px;border:1.5px solid var(--control);background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.edit-row button:hover{border-color:var(--text)}
.edit-row button:disabled{opacity:.35;cursor:not-allowed}
.edit-row button.edit{border-color:var(--accent);color:var(--accent)}
.edit-only{display:none}
.editing .edit-only{display:block}
.editing .edit-only.flex{display:flex}
.editing .unit-side{display:none}
.editing .unit-row{grid-template-columns:minmax(0,1fr)}
.editing .unit-foot{background:#FFFBF2}
.add-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:var(--radius);border:2px dashed var(--accent);background:#fff;color:var(--accent);font-weight:600;font-size:15px;margin-top:10px}
.add-btn:hover{background:var(--accent-soft)}
.editing .page{box-shadow:inset 6px 0 0 #E9B94A}
.edit-tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#1B1616;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.edit-tray p{margin:0;font-size:14px;flex:1 1 100%}
.edit-tray p b{color:#F3CF7B}
.tray-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:1 1 100%}
.tray-link{color:#fff;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:10px 6px}
.tray-done{min-height:44px;padding:0 18px;border-radius:var(--radius-s);background:#F3CF7B;color:#2B1D00;font-weight:700}

/* Check page */
.back-link{font-size:15px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:4px;min-height:40px;padding-right:8px}
.syncline{font-size:13px;color:var(--muted);margin:8px 0 0}
.syncline.off{color:var(--warn)}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel-head span{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label,.field-label{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.picker-label{font-size:14px;font-weight:600;color:var(--ink-2);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.picker-label span{font-weight:400;color:var(--muted);font-size:13px}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.picker button{min-height:58px;border-radius:var(--radius-s);border:1.5px solid var(--control);background:#fff;font-weight:700;font-size:17px;line-height:1.1}
.picker button small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:3px}
.picker button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.picker button.on small{color:#F5DADA}
.fyi{font-size:13px;color:var(--info);background:var(--info-bg);border:1px solid var(--info-line);border-radius:var(--radius-s);padding:9px 11px;margin-top:12px}
.zjump{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;padding-bottom:2px}
.zjump a{white-space:nowrap;font-size:13.5px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--control);background:#fff;color:var(--ink-2);text-decoration:none;font-weight:600}
.zjump a.fail{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.zjump a.done{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}

.zone{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;scroll-margin-top:150px}
.zone-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:#FBF9F9;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.zone-head h2{font-size:16px;flex:1;min-width:0}
.item{padding:14px 16px;border-top:1px solid var(--rule)}
.zone .item:first-of-type{border-top:0}
.item.abn{background:#FFF9F8}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-name{font-weight:600;font-size:16px;line-height:1.3;flex:1;min-width:0}
.item-desc{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.details-btn{font-size:13px;color:var(--accent);font-weight:600;min-height:32px;padding:0 2px;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg button{min-height:52px;border-radius:var(--radius-s);border:1.5px solid var(--control);background:#fff;font-weight:700;font-size:16px;color:var(--ink-2)}
.seg .norm.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .abn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.detail{margin-top:12px;padding:14px;border-radius:var(--radius-s);background:var(--bad-bg);border:1px solid var(--bad-line)}
.q{display:block;font-weight:700;font-size:15px;color:#7A1A14;margin-bottom:6px}
.fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fixgrid button{min-height:48px;border-radius:var(--radius-s);border:1.5px solid var(--control);background:#fff;font-weight:600;font-size:15px;line-height:1.15;padding:6px}
.fixgrid .fixed.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fixgrid .unable.on{background:var(--text);border-color:var(--text);color:#fff}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.photo-row img{width:96px;height:96px;object-fit:cover;border-radius:var(--radius-s);border:1px solid var(--border)}
.photo-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:var(--radius-s);border:1.5px dashed var(--accent);color:var(--accent);font-weight:600;background:#fff;cursor:pointer}
.zone-add{display:flex;align-items:center;justify-content:center;min-height:48px;width:100%;border-top:1px dashed var(--accent);color:var(--accent);font-weight:600;background:#fff}
.zone-add:hover{background:var(--accent-soft)}

/* Sticky bottom bar on check */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar p{margin:0;font-size:14px;color:var(--ink-2)}
.bar .btn-primary{min-width:200px}
.editing .bar{display:none}

.foot{max-width:760px;margin:0 auto;padding:0 16px 150px;font-size:13px;color:var(--muted)}
.foot .link-btn{font-size:13px}

/* Problems and cards */
.problem{padding:14px 16px;border-top:1px solid var(--rule);display:grid;gap:8px}
.problem:first-child{border-top:0}
.problem-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.who{font-size:13px;color:var(--muted)}
.problem-actions{display:flex;gap:8px;flex-wrap:wrap}
.problem-actions .btn-second{min-height:40px;font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--ink-2)}
.tag.red{background:var(--bad-bg);color:var(--bad)}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.pcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.pcard-head p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}

/* Bottom sheet and scrim */
.scrim{position:fixed;inset:0;background:rgba(20,12,12,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:41;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@media (min-width:720px){.sheet{left:50%;right:auto;transform:translateX(-50%);width:520px;bottom:24px;border-radius:var(--radius)}}
.sheet label{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.sheet .actions .btn-danger{margin-right:auto}
.report{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;background:var(--raised);border-radius:var(--radius-s);padding:12px;max-height:50vh;overflow:auto}
.missing li{margin:0 0 8px}
.missing button{text-align:left;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.missing{padding-left:20px;margin:12px 0 0}

.toast{position:fixed;left:50%;top:96px;transform:translate(-50%,-160%);background:#1B1616;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;transition:transform .25s ease,opacity .25s ease;max-width:92vw;text-align:center;opacity:0;visibility:hidden;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.update-bar{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--accent);color:#fff;padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:600;text-align:center}
.update-bar[hidden]{display:none}
.problem-bar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#8E1B1B;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:600;text-align:center}
.problem-bar[hidden]{display:none}
.problem-bar button{min-height:36px;padding:0 14px;border-radius:999px;background:#fff;color:#8E1B1B;font-weight:700}
.update-bar button{min-height:36px;padding:0 14px;border-radius:999px;background:#fff;color:var(--accent);font-weight:700}
.sched{background:#fff;border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin:8px 0 12px;font-size:14px}
.sched-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.sched .tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.mandatory{background:var(--accent);color:#fff}
.shift-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;vertical-align:middle;margin-left:4px}
.shift-A{background:#2E6B2E}
.shift-B{background:#1F5C8B}
.shift-C{background:#B3261E}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="update" class="update-bar" role="status" hidden></div>
<div id="problem" class="problem-bar" role="alert" hidden></div>
<script>
/* =========================================================
   CONFIG. Fill these in before go live. Nothing else needs editing
   for a normal rollout.
   ========================================================= */
const CONFIG = {
  version: '1.7.2',
  versionDate: '2026-11-24',
  // Shared layout Worker (North Country Cloudflare, workers.dev). Reads are public; admin writes need a Microsoft ID token.
  worker: 'https://fd13-apparatus.d-boyce.workers.dev',
  // Bump seedVersion whenever the built-in layout (SEED) changes. Devices re-apply SEED once per bump.
  seedVersion: '2026-11-17-mike',
  // Microsoft sign in. Create the app registration in the district Entra tenant,
  // add the redirect URI for this site, then paste the Client ID here.
  // Microsoft sign in must be set up (clientId, tenantId) for the app to work.
  msal: {

/* 1.7.1: problems stay on screen until they clear. Nothing fails silently.
   The red bar at the bottom has Copy error details, so the report can be sent without a data file. */
const PROBLEMS_NOW = {};
const ERRS = [];
let LOAD_NOTE = '';
function reportProblem(key, msg, err){
  ERRS.unshift({ ts: new Date().toISOString(), key, msg, err: err ? String(err && err.message || err) : '' });
  ERRS.length = Math.min(ERRS.length, 20);
  delete PROBLEMS_NOW[key];
  PROBLEMS_NOW[key] = msg;   // newest last, so the bar shows the latest problem
  renderProblem();
}
function clearProblem(key){
  if (!PROBLEMS_NOW[key]) return;
  delete PROBLEMS_NOW[key];
  renderProblem();
}
function renderProblem(){
  const bar = document.getElementById('problem');
  if (!bar) return;
  const keys = Object.keys(PROBLEMS_NOW);
  if (!keys.length){ bar.hidden = true; bar.innerHTML = ''; return; }
  bar.innerHTML = `<span>${esc(PROBLEMS_NOW[keys[keys.length - 1]])}</span><button type="button" data-act="copy-errors">Copy error details</button>`;
  bar.hidden = false;
}

    when: new Date().toISOString(),
    screen: S && S.screen,
    unit: S && S.apId,
    check: S && S.chk,
    signedIn: !!(S && S.user),
    now: PROBLEMS_NOW,
    recent: ERRS.slice(0, 10)

}

function savePersist(){

// Every change: save on this phone, send the open check to the shared copy, and push layout changes for admins.

/* ---------- Shared layout (Worker) ---------- */
const LAYOUT_FIELDS = ['stOrder', 'chkOrder', 'apEdits', 'zones', 'extraAps'];
let lastPushed = '';
let sharedReady = false;   // set once the shared layout has been read, so a stale device never overwrites it
function layoutJSON(){
  const o = {};
  LAYOUT_FIELDS.forEach(k => o[k] = S[k]);
  return JSON.stringify(o);
}
// Everyone starts from the shared layout when the Worker has one. Drafts, history and problems stay on the device.
async function loadSharedLayout(){
  if (!CONFIG.worker) return false;
  try {
    const res = await fetch(CONFIG.worker + '/state', { cache: 'no-store' });
    if (!res.ok) return false;
    const body = await res.json();
    sharedReady = true;
    if (!body || !body.state) return true;
    LAYOUT_FIELDS.forEach(k => { if (body.state[k] !== undefined) S[k] = body.state[k]; });
    lastPushed = layoutJSON();
    savePersist();
    return true;
  } catch(e) { return false; }
}
async function idToken(){
  const app = msalReady();
  if (!app) return null;
  const acc = app.getActiveAccount() || app.getAllAccounts()[0];
  if (!acc) return null;
  const r = await app.acquireTokenSilent({ scopes: ['openid', 'profile', 'email'], account: acc });
  return r.idToken || null;
}
// Admin changes go to the Worker. Staff and volunteers never write to it.
async function pushSharedLayout(){
  if (!CONFIG.worker || !sharedReady || !S.user || !S.user.ms || !S.user.admin) return;
  const now = layoutJSON();
  if (now === lastPushed) return;
  try {
    const token = await idToken();
    if (!token) { reportProblem('layout', 'Layout changes are not saved for everyone. Sign out and sign in with Microsoft again.'); toast('Not saved for everyone. Sign out and sign in with Microsoft again.'); return; }
    const res = await fetch(CONFIG.worker + '/state', {
      method: 'PUT',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
      body: now
    });
    if (res.ok) { lastPushed = now; setSyncState(true); clearProblem('layout'); }
    else { reportProblem('layout', 'Layout changes are not saved for everyone yet (server status ' + res.status + '). They will try again.'); toast('Not saved for everyone. Try again in a moment.'); }
  } catch(e) {
    reportProblem('layout', 'Layout changes are not saved for everyone. Check the connection. They will try again.', e);
    toast('Not saved for everyone. Check the connection and try again.');
  }
}

/* ---------- Shared check progress (Worker /progress) ----------
   Each open check and each unit's vehicle values are one shared copy per day.
   Answers merge item by item: the newer answer for an item wins. A check is
   "claimed" by whoever touched it last, so the other phone sees who is on it. */
const SHARE = { ok: null, at: 0 };        // ok: true when the last shared call worked, false when it failed, null before any call
const HOLDERS = {};                       // 'apId|chk' -> { by, ts } claim from the shared copy
let pullTimer = null;
const pushTimers = {};

let shareTimer = null;
function setSyncState(ok){
  if (ok) { clearTimeout(shareTimer); shareTimer = null; clearProblem('share'); }
  else if (!shareTimer) {
    shareTimer = setTimeout(() => {
      shareTimer = null;
      if (SHARE.ok === false) reportProblem('share', 'Crew sharing is not working. Your answers are saved on this phone, but the crew cannot see them yet. Tap Copy error details and report it.');
    }, 45 * 1000);
  }
  if (SHARE.ok === ok && Date.now() - SHARE.at < 5000) return;
  SHARE.ok = ok; SHARE.at = Date.now();
  const el = document.querySelector('[data-sync]');
  if (el) el.textContent = syncText();
}
function syncText(){
  const saved = S.savedAt ? clock(S.savedAt) : '';
  if (!CONFIG.worker) return `Saved on this phone${saved ? ' at ' + saved : ''}.`;
  if (SHARE.ok === false) return `Saved on this phone${saved ? ' at ' + saved : ''}. The shared copy is not reachable right now, so the crew cannot see this yet.`;
  if (SHARE.ok === true) return `Saved${saved ? ' at ' + saved : ''} and shared with the crew.`;
  return `Saved on this phone${saved ? ' at ' + saved : ''}.`;
}

// Merge two answer maps. Each entry carries ts, and the newer entry wins.
function mergeMaps(a, b){
  const out = { ...(a || {}) };
  Object.keys(b || {}).forEach(k => {
    const x = out[k], y = b[k];
    if (!y) return;
    if (!x || (y.ts || 0) > (x.ts || 0)) out[k] = y;
  });
  return out;
}
const claimFresh = c => !!c && Date.now() - (c.ts || 0) < CLAIM_MS;

function queuePush(apId, chk){
  if (!CONFIG.worker || !S.user) return;
  const k = serverKey(apId, chk);
  clearTimeout(pushTimers[k]);
  pushTimers[k] = setTimeout(() => pushNow(apId, chk), 600);
}
async function pushNow(apId, chk){
  if (!CONFIG.worker || !S.user) return;
  const d = getDraft(apId, chk);
  // 1.6.4: send the item count so the Hub and CG Staff can show percent done (the Worker needs total for that)
  const total = getZones(apId, chk).reduce((n, z) => n + z.items.length, 0);
  const body = {
    key: serverKey(apId, chk),
    doc: { ans: d.ans, total, claim: chk === VEH ? null : { by: S.user.name, ts: Date.now() } }
  };
  try {
    const res = await fetch(CONFIG.worker + '/progress', {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const out = await res.json();
    setSyncState(true);
    // 1.7.2: answers on this phone that the shared copy did not keep
    const kept = (out.doc && out.doc.ans) || {};
    const lost = Object.keys(d.ans).filter(k => d.ans[k] && d.ans[k].v && !kept[k]);
    if (lost.length) reportProblem('kept', `The shared copy did not keep ${lost.length} ${lost.length === 1 ? 'answer' : 'answers'} from this phone. Tap Copy error details and report it.`);
    else clearProblem('kept');
    applyDoc(body.key, out.doc, true);
  } catch(e) { setSyncState(false); }
}
// Merge a shared copy into this device. Never saves back to the Worker from here, so there is no loop.
function applyDoc(key, doc, fromPush){
  if (!doc) return false;
  const parts = key.replace(/^p:/, '').split('|');
  const apId = parts[1], chk = parts[2];
  if (!apId || !chk) return false;
  const d = getDraft(apId, chk);
  const before = JSON.stringify(d.ans);
  d.ans = mergeMaps(d.ans, doc.ans || {});
  if (chk !== VEH) HOLDERS[apId + '|' + chk] = doc.claim || null;
  const changed = JSON.stringify(d.ans) !== before;
  if (changed) savePersist();
  if (changed && !fromPush) refreshIfIdle();
  return changed;
}
async function pullDay(){
  if (!CONFIG.worker || !S.user) return;
  try {
    const res = await fetch(CONFIG.worker + '/progress?day=' + dutyDay(), { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const body = await res.json();
    setSyncState(true);
    let changed = false;
    Object.keys(body.docs || {}).forEach(k => { if (applyDoc(k, body.docs[k], false)) changed = true; });
    if (changed) refreshIfIdle();
  } catch(e) { setSyncState(false); }
}
async function deleteShared(apId, chk){
  if (!CONFIG.worker) return;
  try {
    await fetch(CONFIG.worker + '/progress?key=' + encodeURIComponent(serverKey(apId, chk)), { method: 'DELETE' });
  } catch(e) { /* the shared copy expires on its own after a few days */ }
}

}

function load(){
  const base = fresh();
  let o = null;
  const raw = localStorage.getItem(CONFIG.storageKey);
  try { o = JSON.parse(raw || 'null'); }
  catch(e) {
    // Keep a copy of the unreadable data before anything saves over it.
    try { localStorage.setItem(CONFIG.storageKey + '_unreadable_' + Date.now(), raw); } catch(x) {}
    LOAD_NOTE = 'Saved data on this phone could not be read, so the app started fresh. A copy of the old data was kept on this phone. Tap Copy error details and report it.';
  }
  if (o) PERSIST.forEach(k => { if (o[k] !== undefined) base[k] = o[k]; });
  try { base.photos = JSON.parse(localStorage.getItem(CONFIG.storageKey + '_photos') || '{}') || {}; } catch(e) { base.photos = {}; }
  try { base.photoLinks = JSON.parse(localStorage.getItem(CONFIG.storageKey + '_photos' + 'links') || '{}') || {}; } catch(e) { base.photoLinks = {}; }
  // Layout seed: when this device's saved layout is from an older seed, take the built-in layout.
  if (!o || o.seedVersion !== CONFIG.seedVersion) {
    base.stOrder = JSON.parse(JSON.stringify(SEED.stOrder));
    base.chkOrder = JSON.parse(JSON.stringify(SEED.chkOrder));
    base.zones = JSON.parse(JSON.stringify(SEED.zones));

/* =========================================================
   HISTORY (the phone and browser Back button)
   Each screen change is a history entry, so Back steps back through the app
   instead of leaving it. Back from a sheet closes the sheet.
   ========================================================= */
let lastNavKey = '';
let lastNav = null;
function navSnap(){
  if (!S.user) return null;
  return { s: S.screen, a: S.apId, c: S.chk, m: S.sheet ? S.sheet.type : null };
}
function syncHistory(){
  const snap = navSnap();
  const key = JSON.stringify(snap);
  if (key === lastNavKey) return;
  const prev = lastNav;
  lastNavKey = key;
  lastNav = snap;
  if (!snap) return;
  // A sheet that was closed on the page: step back over its history entry instead of adding one.
  if (prev && prev.m && !snap.m && prev.s === snap.s && prev.a === snap.a && prev.c === snap.c && history.state && history.state.nav && history.state.nav.m) {
    history.back();
    return;
  }
  const entry = { fd13: true, nav: { ...snap, m: snap.m } };
  if (!history.state || !history.state.fd13) history.replaceState(entry, '');
  else history.pushState(entry, '');
}
window.addEventListener('popstate', e => {
  const nav = e.state && e.state.nav;
  if (!nav || !S.user) return;
  S.screen = nav.s; S.apId = nav.a; S.chk = nav.c;
  S.sheet = null;
  lastNav = { s: nav.s, a: nav.a, c: nav.c, m: null };
  lastNavKey = JSON.stringify(lastNav);
  render();
});

/* ---------- Required checks (Doug 11/18) ----------
   Daily: Engine 51 and Squad 51 every day. 100% when both are done.
   Weekly: Engine 50 and Brush 51 at Station 132, by Sunday. 100% when both are done.
   Shift: Water Tender 51 (A), Engine 52 (B), Water Tender 52 (C). Each needs one check in the week, on a day its shift is on.
   Shift rotation: A on the anchor day, then B, then C, repeating every day.
   Completed means a Pre Shift check was submitted for that unit. */
const SCHED = {
  anchorDay: '2026-11-18',   // A shift
  anchorShift: 0,            // index into SHIFTS
  shifts: ['A', 'B', 'C'],
  daily: ['eng51', 'sq51'],
  weekly: ['eng50', 'brush51'],
  shiftRigs: { A: 'wt51', B: 'eng52', C: 'wt52' }
};
function dayDiff(a, b){
  const [ya, ma, da] = a.split('-').map(Number), [yb, mb, db] = b.split('-').map(Number);
  return Math.round((Date.UTC(yb, mb - 1, db) - Date.UTC(ya, ma - 1, da)) / 86400000);
}
function shiftOn(day){
  const n = ((dayDiff(SCHED.anchorDay, day) % 3) + 3) % 3;
  return SCHED.shifts[(SCHED.anchorShift + n) % 3];
}
function weekRange(day){
  const [y, m, d] = day.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const mondayOffset = (dt.getUTCDay() + 6) % 7;            // Mon = 0 ... Sun = 6
  const mon = new Date(dt.getTime() - mondayOffset * 86400000);
  const sun = new Date(mon.getTime() + 6 * 86400000);
  const iso = x => x.toISOString().slice(0, 10);
  return { from: iso(mon), to: iso(sun) };
}
function completedOn(apId, from, to){
  return S.history.some(h => h.apId === apId && h.chk === 'preshift' && h.day >= from && h.day <= to);
}
function isSunday(day){
  const [y, m, d] = day.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay() === 0;
}
// Each day has three required checks: Engine 51, Squad 51 and today's shift rig. Each is 33 percent.
// On Sunday, Engine 50 and Brush 51 (done any time Monday to Sunday) are added at the end, for five checks in all.
function scheduleStatus(){
  const today = todayKey();
  const wk = weekRange(today);
  const sh = shiftOn(today);
  const shiftId = SCHED.shiftRigs[sh];
  const sun = isSunday(today);
  const dailyDone = SCHED.daily.filter(id => completedOn(id, today, today));
  const shiftDone = completedOn(shiftId, today, today);
  const dayDone = dailyDone.length + (shiftDone ? 1 : 0);
  const weeklyDone = SCHED.weekly.filter(id => completedOn(id, wk.from, wk.to));
  const total = sun ? 5 : 3;
  const done = sun ? dayDone + weeklyDone.length : dayDone;
  return { today, wk, sh, shiftId, sun, shiftDone, dailyDone, weeklyDone, total, done,
    pct: Math.round(100 * done / total) };
}
function shiftTag(code){
  return `<span class="shift-tag shift-${code}">${code} shift</span>`;
}
function scheduleHTML(){
  const st = scheduleStatus();
  const nm = id => AP(id).name;
  const chip = (id, ok) => `<span class="tag ${ok ? 'ok' : ''}">${esc(nm(id))} ${ok ? 'done' : 'not yet'}</span>`;
  const dailyChips = SCHED.daily.map(id => chip(id, completedOn(id, st.today, st.today))).join('');
  const shiftChip = `<span class="tag ${st.shiftDone ? 'ok' : ''}">${esc(nm(st.shiftId))} ${st.shiftDone ? 'done' : 'not yet'}</span>`;
  const weekChips = st.sun ? SCHED.weekly.map(id => chip(id, completedOn(id, st.wk.from, st.wk.to))).join('') : '';
  return `<section class="sched" aria-label="Required checks">
    <div class="sched-row"><b>Today ${st.pct}%</b> ${shiftTag(st.sh)} ${st.total === 3 ? '' : '<span class="muted">Sunday, 5 checks</span>'}</div>
    <div class="sched-row">${dailyChips}${shiftChip}</div>
    ${st.sun ? `<div class="sched-row"><b>Weekly, by Sunday ${esc(st.wk.to)}</b> ${weekChips}</div>` : ''}
  </section>`;
}

// Returns every reason the check cannot be submitted yet.
function missingFor(apId, chk){
  const zones = getZones(apId, chk);
  const d = getDraft(apId, chk);
  const out = [];
  zones.forEach(z => z.items.forEach(i => {
    const an = d.ans[i.id];
    if (!an || !an.v) out.push({ zid: z.id, iid: i.id, text: `${z.name}: ${i.name}, not answered` });
    else if (an.v === 'fail' && !an.fix) out.push({ zid: z.id, iid: i.id, text: `${z.name}: ${i.name}, choose Fixed on the spot or Unable to fix` });
    else if (an.v === 'fail' && an.fix === 'unable' && !(an.note || '').trim()) out.push({ zid: z.id, iid: i.id, text: `${z.name}: ${i.name}, reason needed` });
  }));
  return out;
}

function viewCheck(){
  const a = AP(S.apId);
  const chk = tabDef(a.id, S.chk);
  const adm = isAdminMode();
  const zones = getZones(a.id, chk.id);
  const d = getDraft(a.id, chk.id);
  const photos = photosFor(a.id, chk.id);
  const items = zones.flatMap(z => z.items);
  const answered = items.filter(i => d.ans[i.id] && d.ans[i.id].v).length;
  const fails = items.filter(i => d.ans[i.id] && d.ans[i.id].v === 'fail');
  const unable = fails.filter(i => d.ans[i.id].fix === 'unable').length;
  const missing = missingFor(a.id, chk.id);
  const pills = zones.map(z => {
    const hasFail = z.items.some(i => d.ans[i.id] && d.ans[i.id].v === 'fail');
    const complete = z.items.length && z.items.every(i => d.ans[i.id] && d.ans[i.id].v);
    return `<a class="${hasFail ? 'fail' : complete ? 'done' : ''}" href="#z-${z.id}">${esc(z.name)}</a>`;
  }).join('');
  const ready = items.length && missing.length === 0;
  const finding = fails.length
    ? `<b>${fails.length} abnormal so far.</b> ${unable ? `${unable} unable to fix and goes to the admins.` : 'All fixed on the spot so far.'}`
    : (items.length - answered) ? `${items.length - answered} ${items.length - answered === 1 ? 'item' : 'items'} left to answer.` : 'Every item answered.';
  const carried = openProblems(a.id).filter(p => p.kind === 'check');
  const holder = HOLDERS[a.id + '|' + chk.id];
  const holderOn = holder && claimFresh(holder) && holder.by !== live();
  return `
    ${pagehead(`<button data-act="go" data-screen="aps">Apparatus</button><span>/</span><button data-act="back">${esc(a.name)}</button><span>/</span><span>${esc(chk.name)}</span>`,
      chk.name, `${a.name}, ${answered} of ${items.length} answered`)}
    <p class="syncline" data-sync>${esc(syncText())}</p>
    <div style="height:12px"></div>
    ${holderOn ? `<div class="notice"><b>${esc(holder.by)}</b> has this check open too. Answers merge item by item, and the newer answer wins.</div>` : ''}
    ${carried.length ? problemsCard(carried, 'Known problems on this unit', 'Carried from earlier checks. Still broken fills in this check. Now fixed closes it.') : ''}
    ${vehicleHTML(a, chk.id)}
    <p class="finding">${finding}</p>
    <nav class="zjump" aria-label="Zones">${pills}</nav>
    ${adm ? `<div class="notice warn"><b>Layout editing is on.</b> Move zones and checks with their buttons. Edit changes names and descriptions.</div>` : ''}
    <div>${zones.map(z => zoneHTML(z, adm, d, photos)).join('')}</div>
    ${adm ? `<button class="add-btn" data-act="add-zone">+ Add a zone to this checklist</button>` : ''}
    <div class="bar"><div class="bar-in">
      <p>${answered} of ${items.length} answered${missing.length && answered === items.length ? `, ${missing.length} to finish` : ''}</p>
      <button class="btn-primary" data-act="submit" aria-disabled="${!ready}">
        ${ready ? (fails.length ? `Submit with ${fails.length} abnormal` : 'Submit checklist') : 'To complete'}
      </button>
    </div></div>`;
}

function viewProblems(){
  const open = S.problems.filter(p => p.status === 'open').sort((x, y) => y.ts - x.ts);
  const done = S.problems.filter(p => p.status !== 'open').sort((x, y) => y.ts - x.ts).slice(0, 15);
  const row = p => `<div class="problem">
      <div class="problem-top"><span><b style="font-weight:600">${esc(p.label)}</b> <span class="muted">${esc(p.apName)}</span></span>
        <span class="tag ${p.kind === 'check' ? 'red' : ''}">${p.kind === 'check' ? 'Unable to fix' : 'Request'}</span></div>
      ${p.note ? `<div>${esc(p.note)}</div>` : ''}
      <div class="who">${esc(p.by)}, ${esc(when(p.ts))}${p.status !== 'open' ? `. ${p.status === 'fixed' ? 'Marked fixed' : 'Closed'} by ${esc(p.closedBy || '')}` : ''}</div>
      <div class="problem-actions">
        ${p.status === 'open'
          ? `${p.kind === 'check' ? `<button class="btn-second" data-act="prob-broken" data-id="${p.id}">Still broken</button>` : ''}<button class="btn-second" data-act="prob-fixed" data-id="${p.id}">Now fixed</button>`
          : `<button class="btn-second" data-act="prob-reopen" data-id="${p.id}">Reopen</button>`}
      </div>
    </div>`;
  return `${pagehead(null, 'Open problems', `${open.length} open. Items marked unable to fix on a check show here with the reason.`,
      `<button class="btn-second" data-act="req" data-id="">Report a problem</button>`)}
    <section class="pcard"><div class="pcard-head"><div><h2>Open</h2></div><span class="tag">${open.length}</span></div>
      ${open.map(row).join('') || '<p class="muted" style="padding:16px;margin:0">Nothing open.</p>'}</section>
    ${done.length ? `<section class="pcard"><div class="pcard-head"><div><h2>Recently closed</h2></div></div>${done.map(row).join('')}</section>` : ''}`;
}

/* =========================================================
   LAYOUT EDITING (admin). Buttons, not drag. Every change saves to the shared copy.
   ========================================================= */
function moveIn(arr, id, dir){
  const i = arr.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  return true;
}
function moveAp(id, dir){
  const a = AP(id);
  if (!a || !a.st) return;
  moveIn(S.stOrder[a.st], id, dir);
}
function moveItem(zid, iid, dir){
  const zs = cloneZones(getZones(S.apId, S.chk));
  const z = zs.find(x => x.id === zid);
  if (!z) return;
  const ids = z.items.map(i => i.id);
  if (!moveIn(ids, iid, dir)) return;
  z.items = ids.map(id => z.items.find(i => i.id === id));
  S.zones[zKey()] = zs;
}
function moveZone(zid, dir){
  const zs = cloneZones(getZones(S.apId, S.chk));
  const idx = zs.findIndex(z => z.id === zid);
  if (idx < 0) return;
  const j = idx + dir;
  if (j < 0 || j >= zs.length) return;
  [zs[idx], zs[j]] = [zs[j], zs[idx]];
  S.zones[zKey()] = zs;
}

/* =========================================================
   CHECK LOGIC
   ========================================================= */
// An item answer: { v:'pass'|'fail'|null, fix:'fixed'|'unable'|null, note:'', ts, by }. v null is kept so a cleared answer still wins the merge.
function answer(iid, val){
  const d = getDraft(S.apId, S.chk);
  const cur = d.ans[iid];
  const ts = Date.now(), by = live();
  if (cur && cur.v === val) {
    d.ans[iid] = { v:null, fix:null, note:'', ts, by };
    if (S.photos[dk(S.apId, S.chk)]) delete S.photos[dk(S.apId, S.chk)][iid];
  }
  else if (val === 'pass') d.ans[iid] = { v:'pass', fix:null, note:'', ts, by };
  else d.ans[iid] = { v:'fail', fix: cur && cur.fix || null, note: cur && cur.note || '', ts, by };
}

function setFix(iid, fix){
  const d = getDraft(S.apId, S.chk);
  const cur = d.ans[iid];
  if (!cur || cur.v !== 'fail') return;
  cur.fix = cur.fix === fix ? null : fix;
  cur.ts = Date.now(); cur.by = live();
}

function setNote(iid, text){
  const d = getDraft(S.apId, S.chk);
  const cur = d.ans[iid];
  if (!cur) return;
  cur.note = text; cur.ts = Date.now(); cur.by = live();
}

function setVehicle(field, val){
  const d = getDraft(S.apId, VEH);
  const cur = d.ans[field];
  const next = (cur && cur.v === val) ? null : val;
  d.ans[field] = { v: next, ts: Date.now(), by: live() };
  savePersist();
  queuePush(S.apId, VEH);
}
function setVehicleText(field, text){
  const d = getDraft(S.apId, VEH);
  d.ans[field] = { v: text.trim() ? text.trim().slice(0, 40) : null, ts: Date.now(), by: live() };
  savePersist();
  queuePush(S.apId, VEH);
}

// Known problems: "Still broken" marks the matching item as a fail that is unable to fix,
// with the earlier note carried in. "Now fixed" closes the record.
function problemBroken(id){
  const p = S.problems.find(x => x.id === id);
  if (!p) return;
  p.ts = Date.now();
  p.by = live();
  const zones = getZones(p.apId, p.chk || CHK_LIST[0].id);
  const hit = zones.flatMap(z => z.items).find(i => i.name === p.label);
  if (hit && S.apId === p.apId && S.chk) {
    const d = getDraft(p.apId, S.chk);
    d.ans[hit.id] = { v:'fail', fix:'unable', note: p.note || '', ts: Date.now(), by: live() };
    toast(`${p.label} marked still broken on this check.`);
  } else {
    toast('Still broken noted. It stays on the list.');
  }
}

function problemClose(id, status){
  const p = S.problems.find(x => x.id === id);
  if (!p) return;
  p.status = status;
  p.closedBy = live();
  p.closedAt = Date.now();
  toast(status === 'fixed' ? 'Marked fixed.' : 'Closed.');
}

function buildReport(apId, chk, by, dateStr){
  const a = AP(apId);
  const chkName = tabDef(apId, chk).name;
  const zones = getZones(apId, chk);
  const d = getDraft(apId, chk);
  const v = getDraft(apId, VEH);
  const items = zones.flatMap(z => z.items.map(i => ({ i, z })));
  const fails = items.filter(x => d.ans[x.i.id] && d.ans[x.i.id].v === 'fail');
  const unable = fails.filter(x => d.ans[x.i.id].fix === 'unable');
  const fixed = fails.filter(x => d.ans[x.i.id].fix === 'fixed');
  const passed = items.length - fails.length;
  const lines = [];
  lines.push(`${a.name}: ${chkName}`);
  lines.push(`Checked by: ${by}`);
  lines.push(`Date: ${dateStr}`);
  const vv = k => (v.ans[k] && v.ans[k].v) || 'not entered';
  lines.push(`Engine hours: ${vv('hours')}`);
  lines.push(`Mileage: ${vv('mileage')}`);
  if (chk === 'preshift'){
    lines.push(`Fuel (for the record): ${vv('fuel')}`);
    if (a.requiresDef) lines.push(`DEF (for the record): ${vv('def')}`);
  }
  lines.push('');
  lines.push(fails.length ? `${fails.length} ${fails.length === 1 ? 'ABNORMAL' : 'ABNORMAL ITEMS'}` : 'ALL NORMAL');
  lines.push(`${passed} of ${items.length} normal`);
  if (unable.length){
    lines.push('');
    lines.push('UNABLE TO FIX, IMMEDIATE ADMIN REVIEW');
    unable.forEach(x => lines.push(`  ${x.z.name}: ${x.i.name}. ${d.ans[x.i.id].note}`));
  }
  if (fails.length){
    lines.push('');
    lines.push('ABNORMAL ITEMS');
    fails.forEach(x => {
      const an = d.ans[x.i.id];
      const how = an.fix === 'fixed' ? 'Fixed on the spot' : an.fix === 'unable' ? 'Unable to fix' : 'Not decided';
      lines.push(`  ${x.z.name}: ${x.i.name}. ${how}${an.note ? '. Note: ' + an.note : ''}`);
    });
  }
  const pkey = dk(apId, chk);
  const pics = Object.keys(photosFor(apId, chk));
  const links = (S.photoLinks && S.photoLinks[pkey]) || {};
  if (pics.length){
    lines.push('');
    lines.push(`Photos (${pics.length}):`);
    pics.forEach(id => {
      const it = items.find(x => x.i.id === id);
      const nm = it ? it.i.name : id;
      lines.push(links[id] ? `  ${nm}: ${links[id]}` : `  ${nm}: not uploaded, photo is still on the phone`);
    });
  }
  return { text: lines.join('\n'), headline: fails.length ? `${fails.length} abnormal` : 'All normal', unable, fixed, fails, passed, total: items.length };
}

async function sendEmail(subject, text){
  const e = CONFIG.emailjs;
  if (!e.publicKey || !e.serviceId || !e.templateId || !window.emailjs) return false;
  try {
    emailjs.init({ publicKey: e.publicKey });
    await emailjs.send(e.serviceId, e.templateId, { to_email: e.to, subject, message: text });
    return true;
  } catch (err) { return false; }
}

async function submitCheck(){
  const a = AP(S.apId);
  const d = getDraft(S.apId, S.chk);
  if (missingFor(S.apId, S.chk).length) { S.sheet = { type:'missing' }; render(); return; }
  await finishPhotos(S.apId, S.chk);
  const dateStr = new Date().toLocaleString();
  const rep = buildReport(S.apId, S.chk, live(), dateStr);
  // 1.7.2: the crew board and Hub read the standard name (Pre Shift, SCBA, Monthly Detailed), so a renamed tab keeps it on the record.
  const std = CHK_LIST.find(c => c.id === S.chk);
  const chkName = std ? std.name : tabDef(a.id, S.chk).name;
  const photoMap = S.photoLinks[dk(S.apId, S.chk)] || {};
  const fails = rep.fails.map(x => ({
    zone: x.z.name, item: x.i.name, fix: d.ans[x.i.id].fix, note: d.ans[x.i.id].note || '', photo: photoMap[x.i.id] || ''
  }));
  S.history.unshift({ id: uid(), day: todayKey(), ts: Date.now(), apId: a.id, apName: a.name, chk: S.chk, chkName, by: live(), total: rep.total, fails, sent: false });
  // Unable to fix goes to the open problems list. Repeats update the same record.
  fails.filter(f => f.fix === 'unable').forEach(f => {
    const existing = S.problems.find(p => p.status === 'open' && p.kind === 'check' && p.apId === a.id && p.label === f.item);
    if (existing) { existing.note = f.note; existing.ts = Date.now(); existing.by = live(); existing.chk = S.chk; }
    else S.problems.unshift({ id: uid(), kind:'check', apId: a.id, apName: a.name, chk: S.chk, key: f.zone + '|' + f.item, label: f.item, note: f.note, by: live(), ts: Date.now(), status:'open' });
  });
  // Items answered Fixed on the spot close any matching open problem.
  fails.filter(f => f.fix === 'fixed').forEach(f => {
    S.problems.filter(p => p.status === 'open' && p.kind === 'check' && p.apId === a.id && p.label === f.item)
      .forEach(p => { p.status = 'fixed'; p.closedBy = live(); p.closedAt = Date.now(); });
  });
  const key = dk(S.apId, S.chk);
  deleteShared(S.apId, S.chk);
  delete S.drafts[key];
  if (S.photos[key]) delete S.photos[key];
  if (S.photoLinks[key]) delete S.photoLinks[key];
  delete HOLDERS[a.id + '|' + S.chk];
  S.lastReport = { headline: rep.headline, text: rep.text };
  S.sheet = null;
  S.screen = 'aps';
  savePersist(); savePhotos();
  flushUnsent();
  sendEmail(`${a.name} ${chkName}: ${rep.headline}`, rep.text).then(ok => {
    if (ok) toast('Report emailed.');
  });
  toast(fails.length ? 'Submitted. Report not emailed yet.' : 'Submitted. All normal.');
}

// 1.6.3: send finished checks to the FD13 Worker (the Hub and CG Staff read from there).
// A check that cannot be sent (no signal) stays in history with sent:false and is retried every 15 seconds.
async function flushUnsent(){
  const todo = S.history.filter(h => h.sent !== true).slice(0, 20);
  let changed = false;
  for (const h of todo){
    try {
      const res = await fetch(CONFIG.worker + '/check', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: h.id, day: h.day, ts: h.ts, apId: h.apId, apName: h.apName, chk: h.chk, chkName: h.chkName, by: h.by, total: h.total, fails: h.fails })
      });
      if (res.ok) { h.sent = true; changed = true; }
      else reportProblem('check', `${h.apName} ${h.chkName} did not reach the crew board (server status ${res.status}). It is kept on this phone and will be sent again. Tap Copy error details and report it.`);
    } catch (e) { reportProblem('check', `${h.apName} ${h.chkName} did not reach the crew board. Check the connection. It is kept on this phone and will be sent again.`, e); break; }
  }
  if (changed) savePersist();
  if (!S.history.some(h => h.sent !== true)) clearProblem('check');
}

      S.sheet = null;

    }

      const dests = [...document.querySelectorAll('input[data-copy-to]:checked')].map(x => x.dataset.copyTo);
      if (!dests.length) { toast('Choose at least one unit to copy to.'); return; }

          id: uid(), name: z.name,

    }

      const base = AP(sh.id);
      const name = v('ename') || base.name, info = v('einfo');
      const requiresDef = ((document.getElementById('edef') || {}).value) === 'yes';
      if (S.extraAps.some(x => x.id === sh.id)) {

        S.apEdits[sh.id] = { ...(S.apEdits[sh.id] || {}), requiresDef };
      } else {
        S.apEdits[sh.id] = { ...(S.apEdits[sh.id] || {}), name, info, requiresDef };
      }
      S.sheet = null;
      break;
    }
    case 'edit-zone': {

      const z = zs.find(x => x.id === sh.zid);
      if (z) z.name = v('ename') || z.name;

    }
  }
}

/* =========================================================
   MICROSOFT SIGN IN (MSAL). Runs only when CONFIG.msal.clientId is set.
   ========================================================= */
let msalApp = null;
function msalReady(){
  if (!CONFIG.msal.clientId || !window.msal) return null;
  if (!msalApp) {
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: CONFIG.msal.clientId,
        authority: 'https://login.microsoftonline.com/' + CONFIG.msal.tenantId,
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: { cacheLocation: 'localStorage' }
    });
  }
  return msalApp;
}

async function msalSignIn(){
  const app = msalReady();
  if (!app) { S.msErr = 'Microsoft sign in is not available right now. Refresh the page and try again.'; render(); return; }
  try {
    const acc = app.getAllAccounts()[0];
    if (acc) return msalUser(acc);
    await app.loginRedirect({ scopes: ['openid', 'profile', 'email'] });
  } catch (err) {
    S.msErr = 'Microsoft sign in did not complete. Try again.';
    render();
  }
}

function msalUser(acc){
  // Name and role come from the roster (matched by email) and the admin list. Staff see only the Microsoft button.
  const email = (acc.username || '').toLowerCase();
  const admin = CONFIG.msal.adminEmails.map(x => x.toLowerCase()).includes(email);
  const person = ROSTER.find(p => p.email && p.email.toLowerCase() === email);
  signIn({ id: 'ms-' + email, name: person ? person.name : (acc.name || email), email, admin, ms: true });
  savePersist();
  render();
  startPulls();
}

async function msalHandleRedirect(){
  const app = msalReady();
  if (!app) return;
  try {
    const res = await app.handleRedirectPromise();
    const acc = (res && res.account) || app.getAllAccounts()[0];
    if (acc) msalUser(acc);
  } catch (err) {
    S.msErr = 'Microsoft sign in could not finish. Try again.';
  }
}

    case 'sheet-save': sheetSave(); break;
    case 'close': S.sheet = null; break;
    case 'signout': S.user = null; S.adminMode = false; S.screen = 'signin'; S.sheet = null; clearInterval(pullTimer); break;
    case 'go': S.screen = el.dataset.screen; break;

    case 'open-ap': S.apId = id; S.screen = 'chks'; break;
    case 'open-chk': {
      S.chk = id; S.screen = 'check';
      // Tell the crew this check is open now (claim), and pull the latest shared answers.
      queuePush(S.apId, id);
      pullDay();
      break;
    }
    case 'ans': answer(el.dataset.item, el.dataset.val); break;
    case 'fix': setFix(el.dataset.item, el.dataset.fix); break;
    case 'veh-pick': setVehicle(el.dataset.field, el.dataset.val); return render();
    case 'details': S.open[el.dataset.item] = !S.open[el.dataset.item]; break;
    case 'photo-remove': {
      const key = dk(S.apId, S.chk);
      if (S.photos[key]) delete S.photos[key][el.dataset.item];
      if (S.photoLinks[key]) delete S.photoLinks[key][el.dataset.item];
      savePhotos();
      break;
    }
    case 'submit': submitCheck(); break;
    case 'jump': {
      S.sheet = null;
      render();
      const t = document.querySelector(`.item[data-id="${el.dataset.item}"]`);
      if (t) t.scrollIntoView({ block:'center' });
      return;
    }
    case 'copy-report': {
      const txt = S.lastReport ? S.lastReport.text : '';
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Report copied.'), () => toast('Select the text and copy it.'));
      else toast('Select the text and copy it.');
      return;
    }
    case 'prob-broken': problemBroken(id); break;
    case 'prob-fixed': problemClose(id, 'fixed'); break;
    case 'prob-reopen': { const p = S.problems.find(x => x.id === id); if (p) { p.status = 'open'; } break; }
    case 'toggle-admin': if (S.user && S.user.admin) S.adminMode = !S.adminMode; break;
    case 'copy-errors': copyErrors(); return;
    case 'move': {
      if (el.dataset.kind === 'ap') moveAp(id, Number(el.dataset.dir));
      else if (el.dataset.kind === 'tab') moveTab(S.apId, id, Number(el.dataset.dir));
      break;
    }
    case 'move-zone': moveZone(el.dataset.zone, Number(el.dataset.dir)); break;
    case 'move-item': moveItem(el.dataset.zone, el.dataset.item, Number(el.dataset.dir)); break;
    case 'edit-ap': S.sheet = { type:'edit-ap', id }; break;
    case 'add-ap': S.sheet = { type:'add-ap', st: el.dataset.station }; break;
    case 'del-ap': {
      if (!confirm('Remove this unit from the list? Its saved checks stay on this phone.')) return;
      S.extraAps = S.extraAps.filter(x => x.id !== id);
      Object.keys(S.stOrder).forEach(st => { S.stOrder[st] = S.stOrder[st].filter(x => x !== id); });
      S.sheet = null;
      break;
    }
    case 'edit-zone': S.sheet = { type:'edit-zone', zid: el.dataset.zone }; break;
    case 'edit-item': S.sheet = { type:'edit-item', zid: el.dataset.zone, iid: el.dataset.item }; break;
    case 'add-item': {
      const zs = cloneZones(getZones(S.apId, S.chk));

    }
    case 'add-zone': {
      const zs = cloneZones(getZones(S.apId, S.chk));
      const nid = uid();
      zs.push({ id: nid, name: 'New zone', items: [] });
      S.zones[zKey()] = zs;
      S.sheet = { type:'edit-zone', zid: nid };
      break;
    }
    case 'del-item': {
      const sh = S.sheet;
      const zs = cloneZones(getZones(S.apId, S.chk));
      const z = zs.find(x => x.id === sh.zid);
      if (z) z.items = z.items.filter(i => i.id !== sh.iid);
      S.zones[zKey()] = zs;
      S.sheet = null;
      break;
    }
    case 'add-tab': S.sheet = { type:'add-tab' }; break;
    case 'rename-tab': S.sheet = { type:'rename-tab', id }; break;
    case 'copy-tab': S.sheet = { type:'copy-tab', apId: S.apId, id }; break;
    case 'archive-tab': {
      const t = tabDef(S.apId, id);
      if (!confirm(`Archive "${t.name}" on ${AP(S.apId).name}? Crews will not see this tab. Past checks stay saved, and you can restore it from this list.`)) return;
      setTabs(S.apId, tabsFor(S.apId).map(x => x.id === id ? { ...x, hidden: true } : x));
      break;
    }
    case 'restore-tab': setTabs(S.apId, tabsFor(S.apId).map(x => x.id === id ? { ...x, hidden: false } : x)); break;
    case 'req': S.sheet = { type:'request', apId: id || '' }; break;
    case 'export': {
      const data = { exportedAt: new Date().toISOString(), apEdits: S.apEdits, extraAps: S.extraAps, stOrder: S.stOrder, chkOrder: S.chkOrder, zones: S.zones };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fd13-data.json';
      a.click();
      return;
    }
    case 'reset': S.sheet = { type:'reset' }; break;
    case 'reset-yes': {
      const u = S.user, am = S.adminMode;
      localStorage.removeItem(CONFIG.storageKey);
      localStorage.removeItem(CONFIG.storageKey + '_photos');
      Object.assign(S, fresh());
      S.user = u; S.adminMode = am; S.screen = 'aps';
      break;
    }
    default: return;
  }
  save();
  render();
});

// Photos are shrunk on this phone and kept on this phone only.
function addPhoto(iid, file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const key = dk(S.apId, S.chk);
      S.photos[key] = S.photos[key] || {};
      S.photos[key][iid] = c.toDataURL('image/jpeg', 0.7);
      savePhotos();
      render();
      const item = getZones(S.apId, S.chk).flatMap(z => z.items).find(x => x.id === iid);
      queuePhotoUpload(key, iid, item ? item.name : 'photo');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// Photos go to the FD13 Worker (R2 bucket fd13-check-photos), the same way North Country's checks do.
// The phone keeps its own copy too. A photo that fails to upload is tried again when the check is submitted.
async function uploadPhoto(dataUrl, unit, label){
  const blob = await (await fetch(dataUrl)).blob();
  const res = await fetch(CONFIG.worker + '/photos?unit=' + encodeURIComponent(unit) + '&label=' + encodeURIComponent(label), {
    method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: blob
  });
  const j = await res.json().catch(() => null);
  if (!res.ok || !j || !j.ok) throw new Error((j && j.error) || 'Photo upload failed');
  return j.url;
}
function apUnitName(apId){ const a = AP(apId); return a && a.id ? a.id : 'unit'; }
async function queuePhotoUpload(key, iid, label){
  const dataUrl = S.photos[key] && S.photos[key][iid];
  if (!dataUrl) return;
  try {
    const url = await uploadPhoto(dataUrl, apUnitName(S.apId), label);
    S.photoLinks[key] = S.photoLinks[key] || {};
    S.photoLinks[key][iid] = url;
    savePhotos();
    render();
  } catch (e) { /* stays on the phone; tried again at submit */ }
}
// At submit: upload any photo that has no link yet. Photos that still fail are reported in the email.
async function finishPhotos(apId, chk){
  const key = dk(apId, chk);
  const photos = S.photos[key] || {};
  const items = getZones(apId, chk).flatMap(z => z.items);
  for (const iid of Object.keys(photos)){
    if (S.photoLinks[key] && S.photoLinks[key][iid]) continue;
    const item = items.find(x => x.id === iid);
    try {
      const url = await uploadPhoto(photos[iid], AP(apId).id || 'unit', item ? item.name : 'photo');
      S.photoLinks[key] = S.photoLinks[key] || {};
      S.photoLinks[key][iid] = url;
    } catch (e) { /* reported as not uploaded */ }
  }
  savePhotos();
}

// New-version notice. The app compares the version it is running with the version the server is serving now.
function isNewer(a, b){
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++){
    const d = (x[i] || 0) - (y[i] || 0);
    if (d) return d > 0;
  }
  return false;
}
// 1.7.0: the banner says "Click here to update". Tapping it, or leaving a check screen with nothing open, loads the new copy.
// Saved drafts, history and layout are in this browser, so they stay. The timestamp only forces a fresh copy of the page.
let updateTo = null, updateTimer = null;
function doUpdate(){ location.href = location.pathname + '?v=' + Date.now(); }
function showUpdate(v){
  const bar = document.getElementById('update');
  if (!bar) return;
  updateTo = v;
  bar.innerHTML = '<span>A new version (' + esc(v) + ') is ready. Click here to update.</span>';
  bar.hidden = false;
  bar.onclick = doUpdate;
  // Update on its own when no check is open, so nobody loses an answer in progress.
  if (!updateTimer) updateTimer = setInterval(() => {
    if (updateTo && !(S.screen === 'check' && S.apId && S.chk) && !S.sheet) doUpdate();
  }, 15 * 1000);
}
async function checkVersion(){
  try {
    const r = await fetch('index.html', { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/version:\s*'([^']+)'/);
    if (m && isNewer(m[1], CONFIG.version)) showUpdate(m[1]);
  } catch (e) { /* offline: try again later */ }
}
window.addEventListener('load', async () => {
  if (LOAD_NOTE) reportProblem('load', LOAD_NOTE);
  await msalHandleRedirect();
  await loadSharedLayout();
  render();
  if (S.user) startPulls();
  checkVersion();
  setInterval(checkVersion, 5 * 60 * 1000);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.user) pullDay(); checkVersion(); } });
render();
</script>
